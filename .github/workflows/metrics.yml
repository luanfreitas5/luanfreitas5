# .github/workflows/metrics.yml
name: Cartão de métricas
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest   # fixe em uma tag/SHA depois de testar
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: luanfreitas5
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          config_theme: dark   # gere também a versão light e use <picture>
          output_action: commit
          filename: assets/metrics-dark.svg