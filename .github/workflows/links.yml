# .github/workflows/links.yml
name: Verificar links
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda-feira
  workflow_dispatch:
  pull_request:
    paths: ["README.md"]

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 README.md
          fail: true